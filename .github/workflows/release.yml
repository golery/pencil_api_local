name: Release

# Builds standalone CLI binaries and attaches them to a GitHub release.
# Trigger by pushing a tag that matches package.json, for example v0.1.0.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release.sh --publish
